---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  <p>{{ page.date | date: "%Y-%m-%d" }}</p>

  <div>
    {{ content }}
  </div>

  <hr>

  <div style="font-size: 14px; color: gray;">
    <p>✍️ 作者：{{ site.author }}</p>
    <p>📅 发布日期：{{ page.date | date: "%Y-%m-%d" }}</p>
    <p>📄 本文采用 MIT License（代码部分），文章内容转载请注明出处。</p>
  </div>
</article>
